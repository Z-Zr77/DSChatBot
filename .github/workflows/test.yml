name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pack/package-lock.json

      - name: 安装依赖
        working-directory: pack
        run: npm ci --no-audit --no-fund

      - name: 跑测试套件
        working-directory: pack
        run: npm test
